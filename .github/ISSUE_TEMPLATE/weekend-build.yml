name: Weekend build
description: Anything else weird and buildable in a weekend
title: "[weekend-build] "
labels: ["weekend-build"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is it, and why is it fun?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you've tried
      description: Tools, scripts, prompts, spreadsheets, nothing. All fine.
  - type: textarea
    id: done
    attributes:
      label: What "done" looks like
      description: The smallest version that would actually help.
    validations:
      required: true
